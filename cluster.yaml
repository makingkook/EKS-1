apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wsi-eks-cluster
  region: ap-northeast-1
  version: "1.35"

iam:
  withOIDC: true

vpc:
  subnets:
    private:
      ap-northeast-1a: { id: {subnetID} }
      ap-northeast-1c: { id: {subnetID} }
  clusterEndpoints:
    privateAccess: true
    publicAccess: false

managedNodeGroups:
  - name: wsi-eks-nodegroup
    instanceType: t3.medium

    desiredCapacity: 2
    minSize: 2
    maxSize: 2

    privateNetworking: true

    labels:
      node: wsi
